name: Build Unsigned IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project "Russell Kestrel iOS 03.xcodeproj" -scheme RussellKestrel
      - name: Build unsigned app
        run: |
          xcodebuild -project "Russell Kestrel iOS 03.xcodeproj" -scheme RussellKestrel -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CONFIGURATION_BUILD_DIR="$PWD/build" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/RussellKestrel.app Payload/
          zip -r Russell-Kestrel-iOS-0.3-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Russell-Kestrel-iOS-0.3-unsigned-IPA
          path: Russell-Kestrel-iOS-0.3-unsigned.ipa
